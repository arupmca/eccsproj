<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Login | Sadya High School Employees' Credit Co-operative Society Ltd.</title>
<link rel="icon" href="images/logo.png" type="image/png">
<link rel="stylesheet" href="login.css">
</head>
<body class="login-body">

  <div class="login-page">

    <!-- Left panel: photo + caption -->
    <div class="login-visual">
      <div class="login-visual-image">
        <img src="images/login.jpg" alt="Sadya High School campus">
      </div>
      <div class="login-visual-caption">
        <h2>A Co-Operative you can<br>log into with confidence</h2>
        <p>Access your loan schedules, balances, and statements &ndash; all in one secure place.</p>
      </div>
    </div>

    <!-- Right panel: sign-in form -->
    <div class="login-form-side">
      <form class="login-card" id="loginForm" action="#" method="post" novalidate>

        <div class="login-card-header">
          <div>
            <h1 class="login-title">Sign In</h1>
            <p class="login-subtitle">Member, Admin</p>
          </div>
          <img src="images/logo.png" alt="Society Logo" class="login-logo">
        </div>

        <label class="login-label" for="userid">Userid</label>
        <input class="login-input" type="text" id="userid" name="userid" autocomplete="username" placeholder="">

        <label class="login-label" for="password">Password</label>
        <input class="login-input" type="password" id="password" name="password" autocomplete="current-password" placeholder="">

        <p class="login-error" id="loginError"></p>

        <button type="submit" class="login-submit">Sign in</button>

        <a href="index.html" class="login-back">&larr; Back to home</a>
      </form>
    </div>

  </div>

  <script>
    // Demo-only credential check (for now, before real authentication is wired up).
    var DEMO_USERS = {
      "admin": { password: "admin123#", redirect: "admin-dashboard.html" },
      "member@gmail.com": { password: "member123#", redirect: "member-welcome.html" }
    };

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      var userid = document.getElementById("userid").value.trim();
      var password = document.getElementById("password").value;
      var errorEl = document.getElementById("loginError");

      var account = DEMO_USERS[userid];

      if (account && account.password === password) {
        errorEl.textContent = "";
        window.location.href = account.redirect;
      } else {
        errorEl.textContent = "Invalid userid or password. Please try again.";
      }
    });
  </script>

</body>
</html>
